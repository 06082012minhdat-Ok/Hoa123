<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phòng Thí Nghiệm Hóa Học Ảo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2f;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #00d2ff;
            text-align: center;
        }

        .container {
            display: flex;
            gap: 30px;
            margin-top: 20px;
            max-width: 1000px;
            width: 100%;
        }

        /* Tủ hóa chất */
        .cabinet {
            background: #2a2a40;
            padding: 20px;
            border-radius: 10px;
            flex: 1;
            border: 2px solid #3a3a50;
        }

        .chemical-btn {
            background: #3a3a50;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
            font-weight: bold;
        }

        .chemical-btn:hover {
            background: #00d2ff;
            color: #000;
        }

        /* Khu vực phản ứng */
        .lab-bench {
            background: #2a2a40;
            padding: 20px;
            border-radius: 10px;
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid #3a3a50;
        }

        .flask {
            width: 150px;
            height: 150px;
            border: 4px solid #fff;
            border-radius: 10px 10px 75px 75px;
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            overflow: hidden;
            position: relative;
            background: rgba(255, 255, 255, 0.1);
        }

        .liquid {
            width: 100%;
            height: 0%;
            background-color: transparent;
            transition: height 0.5s, background-color 0.5s;
        }

        .controls button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        .btn-react { background: #00ff88; color: #000; }
        .btn-react:hover { background: #00cc6a; }
        .btn-clear { background: #ff4444; color: #fff; }
        .btn-clear:hover { background: #cc0000; }

        /* Bảng kết quả */
        .result-board {
            margin-top: 20px;
            background: #111;
            padding: 15px;
            border-radius: 5px;
            width: 100%;
            text-align: center;
            min-height: 80px;
            font-size: 18px;
        }

        /* Hiệu ứng Nổ */
        @keyframes explode {
            0% { transform: scale(1); background-color: #ff0000; }
            50% { transform: scale(1.2); background-color: #ffff00; box-shadow: 0 0 50px #ffaa00; }
            100% { transform: scale(1); background-color: #ff4400; }
        }
        .explosion {
            animation: explode 0.5s infinite;
        }

        .equation {
            color: #00d2ff;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>🧪 Phòng Thí Nghiệm Hóa Học Ảo</h1>

    <div class="container">
        <!-- Tủ hóa chất -->
        <div class="cabinet">
            <h3>Tủ Hóa Chất</h3>
            <p><i>(Nhấn để thêm vào bình)</i></p>
            <button class="chemical-btn" onclick="addChemical('Na')">Natri (Na)</button>
            <button class="chemical-btn" onclick="addChemical('H2O')">Nước (H2O)</button>
            <button class="chemical-btn" onclick="addChemical('HCl')">Axit HCl</button>
            <button class="chemical-btn" onclick="addChemical('NaOH')">Bazo NaOH</button>
            <button class="chemical-btn" onclick="addChemical('QuỳTím')">Quỳ Tím</button>
        </div>

        <!-- Bàn thí nghiệm -->
        <div class="lab-bench">
            <h3>Bình Thí Nghiệm</h3>
            <p id="current-chemicals">Chất đang có: Trống</p>
            
            <div class="flask" id="flask">
                <div class="liquid" id="liquid"></div>
            </div>

            <div class="controls">
                <button class="btn-react" onclick="doReaction()">⚡ Tiến Hành Phản Ứng</button>
                <button class="btn-clear" onclick="clearFlask()">🗑️ Rửa Bình</button>
            </div>

            <div class="result-board" id="result-board">
                Đang chờ phản ứng...
            </div>
        </div>
    </div>

    <script>
        // Mảng chứa các chất hiện có trong bình
        let flaskContents = [];

        // Thêm chất vào bình
        function addChemical(chemical) {
            if (flaskContents.length >= 2) {
                alert("Bình chỉ chứa tối đa 2 chất để thử nghiệm!");
                return;
            }
            if (flaskContents.includes(chemical)) {
                alert("Chất này đã có trong bình!");
                return;
            }
            
            flaskContents.push(chemical);
            updateUI();
        }

        // Cập nhật giao diện
        function updateUI() {
            const display = document.getElementById('current-chemicals');
            const liquid = document.getElementById('liquid');

            if (flaskContents.length === 0) {
                display.innerText = "Chất đang có: Trống";
                liquid.style.height = "0%";
                liquid.style.backgroundColor = "transparent";
            } else {
                display.innerText = "Chất đang có: " + flaskContents.join(" + ");
                liquid.style.height = (flaskContents.length * 40) + "%";
                liquid.style.backgroundColor = "rgba(255, 255, 255, 0.5)"; // Màu lỏng cơ bản
            }
        }

        // Làm sạch bình
        function clearFlask() {
            flaskContents = [];
            document.getElementById('flask').classList.remove('explosion');
            document.getElementById('result-board').innerHTML = "Đang chờ phản ứng...";
            updateUI();
        }

        // Cơ sở dữ liệu phản ứng
        const reactionDB = {
            "H2O+Na": {
                equation: "2Na + 2H2O → 2NaOH + H2 ↑",
                message: "💥 BÙM! Natri phản ứng mãnh liệt với nước, tỏa nhiều nhiệt và khí Hydro sinh ra bốc cháy!",
                color: "#ffaa00",
                effect: "explosion"
            },
            "HCl+NaOH": {
                equation: "HCl + NaOH → NaCl + H2O",
                message: "✅ Phản ứng trung hòa tạo ra muối ăn (NaCl) và nước.",
                color: "#aae6ff",
                effect: "none"
            },
            "HCl+QuỳTím": {
                equation: "HCl + Quỳ Tím",
                message: "🔴 Axit làm quỳ tím hóa đỏ.",
                color: "#ff4444",
                effect: "none"
            },
            "NaOH+QuỳTím": {
                equation: "NaOH + Quỳ Tím",
                message: "🔵 Bazo làm quỳ tím hóa xanh.",
                color: "#4444ff",
                effect: "none"
            },
            "H2O+QuỳTím": {
                equation: "H2O + Quỳ Tím",
                message: "⚪ Nước trung tính, quỳ tím không đổi màu.",
                color: "#d4a3ff", // Màu tím nhạt
                effect: "none"
            }
        };

        // Thực hiện phản ứng
        function doReaction() {
            const board = document.getElementById('result-board');
            const flask = document.getElementById('flask');
            const liquid = document.getElementById('liquid');

            if (flaskContents.length < 2) {
                board.innerHTML = "<span style='color: yellow;'>Cần ít nhất 2 chất để xảy ra phản ứng!</span>";
                return;
            }

            // Sắp xếp theo bảng chữ cái để khớp với Database (H2O+Na giống Na+H2O)
            const combination = flaskContents.sort().join("+");
            const result = reactionDB[combination];

            flask.classList.remove('explosion'); // Xóa hiệu ứng cũ

            if (result) {
                // Có phản ứng xảy ra
                board.innerHTML = `
                    <div class="equation">${result.equation}</div>
                    <div>${result.message}</div>
                `;
                liquid.style.backgroundColor = result.color;

                if (result.effect === "explosion") {
                    flask.classList.add('explosion');
                }
            } else {
                // Không có phản ứng
                board.innerHTML = `
                    <div class="equation">${flaskContents.join(" + ")} → Không phản ứng</div>
                    <div style="color: gray;">Các chất này không tác dụng với nhau hoặc tạo ra dung dịch hỗn hợp.</div>
                `;
                liquid.style.backgroundColor = "rgba(255, 255, 255, 0.4)";
            }
        }
    </script>
</body>
</html>
